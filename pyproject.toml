[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "co-scraper"
version = "0.1.0"
description = "Query-aware DOM pruning and reusable web scraper synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Co-Scraper contributors"}
]
keywords = ["web-scraping", "information-extraction", "dom-pruning", "llm", "xpath"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "lxml>=4.9,<7",
  "openai>=1.40"
]

[project.optional-dependencies]
browser = [
  "playwright>=1.40"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
coscraper = "coscraper.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/coscraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
